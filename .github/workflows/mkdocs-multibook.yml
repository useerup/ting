name: Build and Deploy MkDocs Books

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs toolchain
        run: >-
          pip install
          mkdocs
          mkdocs-material
          mkdocs-awesome-pages-plugin
          mkdocs-section-index
          pymdown-extensions

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Programmer's Guide
        run: mkdocs build -f mkdocs.guide.yml

      - name: Build Programmer's Reference
        run: mkdocs build -f mkdocs.reference.yml

      - name: Build Language Specification
        run: mkdocs build -f mkdocs.spec.yml

      - name: Build Documentation Hub
        run: mkdocs build -f mkdocs.yml

      - name: Bundle books into hub
        run: |
          set -euo pipefail
          for book in guide reference spec; do
            mkdir -p "site/${book}"
            cp -r "build/${book}/." "site/${book}/"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
