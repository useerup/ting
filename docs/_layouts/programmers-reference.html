<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} – Docs</title>
</head>
<body>

<nav>
  {% include nav.html %}
</nav>

<aside>
  <h3>Documentation</h3>
  <ul>
    {% assign sorted = site.programmers_reference %}
    {% for doc in sorted %}
      <li><a href="{{ doc.url }}">{{ doc.title }}</a></li>
    {% endfor %}
  </ul>
</aside>

<main>
  {{ content }}
</main>

</body>
</html>
